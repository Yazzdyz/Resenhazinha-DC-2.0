name: Publicar versão do Resenhazinha

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "3.0.3"

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Aplicar atualização preparada
        shell: pwsh
        run: |
          $partNames = @(
            "01.txt", "02.txt", "03.txt",
            "04r1.txt", "04r2.txt", "04r3.txt", "04r4.txt",
            "04fix2.txt", "04fix3.txt", "04fix4.txt", "04fix5.txt", "04fix6.txt", "04fix7.txt",
            "05.txt", "06.txt", "07.txt", "08.txt"
          )
          $parts = $partNames | ForEach-Object { Get-Item (Join-Path ".github/patch-parts" $_) }
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          $gzipPath = Join-Path $env:RUNNER_TEMP "resenhazinha.patch.gz"
          $patchPath = Join-Path $env:RUNNER_TEMP "resenhazinha.patch"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$patchPath"
          git apply --whitespace=nowarn $patchPath

      - name: Restaurar sons clássicos do Discord
        shell: pwsh
        run: |
          $path = "src/main.js"
          $content = Get-Content $path -Raw
          $content = $content.Replace('voiceLeave: "https://www.myinstants.com/media/sounds/y2mate_VKI8qDn.mp3"', 'voiceLeave: "https://www.myinstants.com/media/sounds/discord-leave-noise.mp3"')
          $content = $content.Replace('screenStart: null,', 'screenStart: "https://www.myinstants.com/media/sounds/discord-stream-start_7MsfgpB.mp3",')
          $content = $content.Replace('screenStop: null,', 'screenStop: "https://www.myinstants.com/media/sounds/discord-stream-stop.mp3",')
          Set-Content -Path $path -Value $content -NoNewline -Encoding utf8

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Preparar Setup e atualização automática
        shell: pwsh
        run: |
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.version=process.env.APP_VERSION; p.main="electron/bootstrap.cjs"; p.scripts["package:win"]="npm run build && electron-builder --win nsis --x64 --publish always"; p.dependencies={...(p.dependencies||{}),"electron-updater":"6.8.9"}; p.devDependencies={...(p.devDependencies||{}),"electron-builder":"26.16.0"}; p.build={appId:"com.yazzdyz.resenhazinha",productName:"Resenhazinha",asar:true,npmRebuild:false,directories:{output:"release"},files:["dist/**/*","electron/**/*","public/**/*","package.json","!src/**/*","!release/**/*","!.github/**/*","!upload/**/*","!*.zip"],extraResources:[{from:"node_modules/loopback-capture/build/Release/loopback_capture_addon.node",to:"loopback_capture_addon.node"},{from:"THIRD_PARTY_NOTICES.txt",to:"THIRD_PARTY_NOTICES.txt"}],win:{target:[{target:"nsis",arch:["x64"]}],icon:"public/icon.ico",artifactName:"Resenhazinha-Setup-${version}.${ext}"},nsis:{oneClick:false,allowToChangeInstallationDirectory:true,createDesktopShortcut:"always",createStartMenuShortcut:true,shortcutName:"Resenhazinha",runAfterFinish:true,deleteAppDataOnUninstall:false},publish:[{provider:"github",owner:"Yazzdyz",repo:"Resenhazinha-DC-2.0",releaseType:"release",tagNamePrefix:"v"}]}; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'

      - name: Instalar dependências
        run: npm install

      - name: Montar Setup e publicar release
        run: npm run package:win
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Guardar instalador como artefato do Actions
        uses: actions/upload-artifact@v4
        with:
          name: Resenhazinha-Setup-${{ env.APP_VERSION }}
          path: |
            release/Resenhazinha-Setup-*.exe
            release/Resenhazinha-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
