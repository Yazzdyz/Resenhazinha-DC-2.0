name: Publicar versão

on:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'release: prepare v')
    name: Validar e publicar para Windows
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Conferir versão
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"

          if ("${{ github.ref }}" -like "refs/tags/*" -and "${{ github.ref_name }}" -ne $expectedTag) {
            throw "A tag ${{ github.ref_name }} não corresponde à versão $version do package.json."
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=$expectedTag" >> $env:GITHUB_OUTPUT

      - name: Instalar dependências
        run: npm ci

      - name: Testar e validar
        run: npm run check

      - name: Montar instalador
        run: npm run package:win

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "Resenhazinha $env:TAG" `
              --generate-notes
          }

          gh release upload $env:TAG `
            "release/Resenhazinha-Setup-$env:VERSION.exe" `
            "release/Resenhazinha-Setup-$env:VERSION.exe.blockmap" `
            "release/latest.yml" `
            --repo "${{ github.repository }}" `
            --clobber

      - name: Guardar instalador no Actions
        uses: actions/upload-artifact@v4
        with:
          name: Resenhazinha-Setup-${{ steps.version.outputs.value }}
          path: |
            release/Resenhazinha-Setup-*.exe
            release/Resenhazinha-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
