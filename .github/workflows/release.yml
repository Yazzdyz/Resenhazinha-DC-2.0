name: Publicar versão do Resenhazinha

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/inspect/**"
      - ".github/workflows/inspect-patched.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  APP_VERSION: "4.4.1"

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Conferir versão declarada
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -ne $env:APP_VERSION) {
            throw "package.json ($packageVersion) e APP_VERSION ($env:APP_VERSION) estão diferentes."
          }

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar sessões de call e bundle
        run: npm run check

      - name: Montar Setup do Windows
        run: npm run package:win

      - name: Garantir tag da versão
        shell: pwsh
        run: |
          $tag = "v$env:APP_VERSION"
          git fetch --tags --force
          if (-not (git tag --list $tag)) {
            git tag $tag $env:GITHUB_SHA
            git push origin $tag
          }

      - name: Publicar arquivos da atualização
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --target $env:GITHUB_SHA --title "Resenhazinha $tag" --notes "Corrige voz, tela, sons e fotos no modo Cloudflare com eventos dedicados de mídia e ressincronização de perfis."
          }
          gh release upload $tag `
            "release/Resenhazinha-Setup-$env:APP_VERSION.exe" `
            "release/Resenhazinha-Setup-$env:APP_VERSION.exe.blockmap" `
            "release/latest.yml" `
            --repo "${{ github.repository }}" --clobber

      - name: Guardar instalador como artefato do Actions
        uses: actions/upload-artifact@v4
        with:
          name: Resenhazinha-Setup-${{ env.APP_VERSION }}
          path: |
            release/Resenhazinha-Setup-*.exe
            release/Resenhazinha-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
