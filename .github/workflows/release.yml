name: Publicar versão do Resenhazinha

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/inspect/**"
      - ".github/workflows/inspect-patched.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "3.2.1"

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Aplicar atualização preparada
        shell: pwsh
        run: |
          $partNames = @(
            "01.txt", "02.txt", "03.txt",
            "04r1.txt", "04r2.txt", "04r3.txt", "04r4.txt",
            "04fix2.txt", "04fix3.txt", "04fix4.txt", "04fix5.txt", "04fix6.txt", "04fix7.txt",
            "05.txt", "06.txt", "07.txt", "08.txt"
          )
          $parts = $partNames | ForEach-Object { Get-Item (Join-Path ".github/patch-parts" $_) }
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          $gzipPath = Join-Path $env:RUNNER_TEMP "resenhazinha.patch.gz"
          $patchPath = Join-Path $env:RUNNER_TEMP "resenhazinha.patch"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$patchPath"
          git apply --whitespace=nowarn $patchPath

      - name: Aplicar sair e excluir servidor
        shell: pwsh
        run: |
          $encoded = (Get-Content ".github/apply-server-exit-v3.0.5.py.gz.b64" -Raw).Trim()
          $gzipPath = Join-Path $env:RUNNER_TEMP "apply-server-exit.py.gz"
          $scriptPath = Join-Path $env:RUNNER_TEMP "apply-server-exit.py"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$scriptPath"
          python "$scriptPath"
          node --check src/main.js

      - name: Aplicar menu visível do servidor
        shell: pwsh
        run: |
          $encoded = (Get-Content ".github/apply-server-menu-v3.0.6.py.gz.b64" -Raw).Trim()
          $gzipPath = Join-Path $env:RUNNER_TEMP "apply-server-menu-v306.py.gz"
          $scriptPath = Join-Path $env:RUNNER_TEMP "apply-server-menu-v306.py"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$scriptPath"
          python "$scriptPath"
          node --check src/main.js
          node --check electron/main.cjs
          node --check electron/preload.cjs

      - name: Aplicar voz e mixers 0 a 200
        shell: pwsh
        run: |
          $encoded = (Get-Content ".github/apply-voice-mixer-v3.1.0.py.gz.b64" -Raw).Trim()
          $gzipPath = Join-Path $env:RUNNER_TEMP "apply-voice-mixer-v310.py.gz"
          $scriptPath = Join-Path $env:RUNNER_TEMP "apply-voice-mixer-v310.py"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$scriptPath"
          python "$scriptPath"
          node --check src/main.js
          node --check electron/main.cjs
          node --check electron/preload.cjs

      - name: Aplicar revisão de áudio e configurações
        shell: pwsh
        run: |
          $encoded = (Get-Content ".github/apply-resenhazinha-v3.2.0.py.gz.b64" -Raw).Trim()
          $gzipPath = Join-Path $env:RUNNER_TEMP "apply-resenhazinha-v320.py.gz"
          $scriptPath = Join-Path $env:RUNNER_TEMP "apply-resenhazinha-v320.py"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$scriptPath"
          python "$scriptPath"
          node --check src/main.js
          node --check public/mic-noise-worklet.js
          node --check electron/main.cjs
          node --check electron/preload.cjs

      - name: Aplicar interface e fullscreen v3.2.1
        shell: pwsh
        run: |
          $encoded = (Get-Content ".github/apply-ui-v3.2.1.patch.gz.b64" -Raw).Trim()
          $gzipPath = Join-Path $env:RUNNER_TEMP "apply-ui-v321.patch.gz"
          $patchPath = Join-Path $env:RUNNER_TEMP "apply-ui-v321.patch"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$patchPath"
          git apply --whitespace=nowarn $patchPath
          git diff --check
          node --check src/main.js
          node --check public/mic-noise-worklet.js
          node --check electron/main.cjs
          node --check electron/preload.cjs

      - name: Restaurar sons clássicos do Discord
        shell: pwsh
        run: |
          $path = "src/main.js"
          $content = Get-Content $path -Raw
          $content = $content.Replace('voiceLeave: "https://www.myinstants.com/media/sounds/y2mate_VKI8qDn.mp3"', 'voiceLeave: "https://www.myinstants.com/media/sounds/discord-leave-noise.mp3"')
          $content = $content.Replace('screenStart: null,', 'screenStart: "https://www.myinstants.com/media/sounds/discord-stream-start_7MsfgpB.mp3",')
          $content = $content.Replace('screenStop: null,', 'screenStop: "https://www.myinstants.com/media/sounds/discord-stream-stop.mp3",')
          Set-Content -Path $path -Value $content -NoNewline -Encoding utf8

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Preparar Setup e atualização automática
        shell: pwsh
        run: |
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.version=process.env.APP_VERSION; p.main="electron/bootstrap.cjs"; p.scripts["package:win"]="npm run build && electron-builder --win nsis --x64 --publish never"; p.dependencies={...(p.dependencies||{}),"electron-updater":"6.8.9"}; p.devDependencies={...(p.devDependencies||{}),"electron-builder":"26.16.0"}; p.build={appId:"com.yazzdyz.resenhazinha",productName:"Resenhazinha",asar:true,npmRebuild:false,directories:{output:"release"},files:["dist/**/*","electron/**/*","public/**/*","package.json","!src/**/*","!release/**/*","!.github/**/*","!upload/**/*","!*.zip"],extraResources:[{from:"node_modules/loopback-capture/build/Release/loopback_capture_addon.node",to:"loopback_capture_addon.node"},{from:"THIRD_PARTY_NOTICES.txt",to:"THIRD_PARTY_NOTICES.txt"}],win:{target:[{target:"nsis",arch:["x64"]}],icon:"public/icon.ico",artifactName:"Resenhazinha-Setup-${version}.${ext}"},nsis:{oneClick:false,allowToChangeInstallationDirectory:true,createDesktopShortcut:"always",createStartMenuShortcut:true,shortcutName:"Resenhazinha",runAfterFinish:true,deleteAppDataOnUninstall:false},publish:[{provider:"github",owner:"Yazzdyz",repo:"Resenhazinha-DC-2.0",releaseType:"release",tagNamePrefix:"v"}]}; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'

      - name: Garantir tag da versão
        shell: pwsh
        run: |
          $tag = "v$env:APP_VERSION"
          git fetch --tags --force
          $existing = git tag --list $tag
          if (-not $existing) {
            git tag $tag $env:GITHUB_SHA
            git push origin $tag
          }

      - name: Instalar dependências
        run: npm install

      - name: Montar Setup do Windows
        run: npm run package:win

      - name: Publicar arquivos da atualização
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --target $env:GITHUB_SHA --title "Resenhazinha $tag"
          }
          gh release upload $tag "release/Resenhazinha-Setup-$env:APP_VERSION.exe" "release/Resenhazinha-Setup-$env:APP_VERSION.exe.blockmap" "release/latest.yml" --repo "${{ github.repository }}" --clobber

      - name: Guardar instalador como artefato do Actions
        uses: actions/upload-artifact@v4
        with:
          name: Resenhazinha-Setup-${{ env.APP_VERSION }}
          path: |
            release/Resenhazinha-Setup-*.exe
            release/Resenhazinha-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
