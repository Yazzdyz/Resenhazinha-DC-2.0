name: Publicar versão do Resenhazinha

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Aplicar atualização preparada
        shell: pwsh
        run: |
          $partNames = @(
            "01.txt", "02.txt", "03.txt",
            "04r1.txt", "04r2.txt", "04r3.txt", "04r4.txt",
            "04fix2.txt", "04fix3.txt", "04fix4.txt", "04fix5.txt", "04fix6.txt", "04fix7.txt",
            "05.txt", "06.txt", "07.txt", "08.txt"
          )
          $parts = $partNames | ForEach-Object { Get-Item (Join-Path ".github/patch-parts" $_) }
          foreach ($part in $parts) {
            $text = (Get-Content $part.FullName -Raw).Trim()
            $bytes = [Text.Encoding]::UTF8.GetBytes($text)
            $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLower()
            Write-Host "$($part.Name) $($text.Length) $hash"
          }
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          $gzipPath = Join-Path $env:RUNNER_TEMP "resenhazinha.patch.gz"
          $patchPath = Join-Path $env:RUNNER_TEMP "resenhazinha.patch"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$patchPath"
          git apply --whitespace=nowarn $patchPath

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Ler versão
        shell: pwsh
        run: |
          $version = (Get-Content ./package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_ASSET=Resenhazinha-$tag-Windows.zip" >> $env:GITHUB_ENV

      - name: Instalar dependências
        run: npm ci

      - name: Montar aplicativo Windows
        run: npm run package:win

      - name: Criar ZIP do Windows
        shell: pwsh
        run: |
          Compress-Archive -Path "release/Resenhazinha-win32-x64/*" -DestinationPath "$env:RELEASE_ASSET" -CompressionLevel Optimal

      - name: Criar ou atualizar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Resenhazinha $env:RELEASE_TAG" --generate-notes
          }
          gh release upload "$env:RELEASE_TAG" "$env:RELEASE_ASSET" --repo "${{ github.repository }}" --clobber
