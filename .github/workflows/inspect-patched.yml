name: Inspecionar fonte montada

on:
  push:
    paths:
      - ".github/workflows/inspect-patched.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Aplicar atualização preparada
        shell: pwsh
        run: |
          $partNames = @(
            "01.txt", "02.txt", "03.txt",
            "04r1.txt", "04r2.txt", "04r3.txt", "04r4.txt",
            "04fix2.txt", "04fix3.txt", "04fix4.txt", "04fix5.txt", "04fix6.txt", "04fix7.txt",
            "05.txt", "06.txt", "07.txt", "08.txt"
          )
          $parts = $partNames | ForEach-Object { Get-Item (Join-Path ".github/patch-parts" $_) }
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          $gzipPath = Join-Path $env:RUNNER_TEMP "resenhazinha.patch.gz"
          $patchPath = Join-Path $env:RUNNER_TEMP "resenhazinha.patch"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$patchPath"
          git apply --whitespace=nowarn $patchPath

      - name: Aplicar patches Python
        shell: pwsh
        run: |
          $items = @(
            @(".github/apply-server-exit-v3.0.5.py.gz.b64", "server-exit.py"),
            @(".github/apply-server-menu-v3.0.6.py.gz.b64", "server-menu.py"),
            @(".github/apply-voice-mixer-v3.1.0.py.gz.b64", "voice-mixer.py"),
            @(".github/apply-resenhazinha-v3.2.0.py.gz.b64", "v320.py")
          )
          foreach ($item in $items) {
            $encoded = (Get-Content $item[0] -Raw).Trim()
            $gzipPath = Join-Path $env:RUNNER_TEMP ($item[1] + ".gz")
            $scriptPath = Join-Path $env:RUNNER_TEMP $item[1]
            [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
            python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$scriptPath"
            python "$scriptPath"
          }

      - name: Aplicar patches recentes e hotfix
        shell: pwsh
        run: |
          $items = @(
            @(".github/apply-ui-v3.2.1.patch.gz.b64", "ui.patch"),
            @(".github/apply-voice-presence-v3.3.0.patch.gz.b64", "voice.patch"),
            @(".github/apply-stability-v3.3.1.patch.gz.b64", "stability.patch"),
            @(".github/apply-hotfix-v3.3.2.patch.gz.b64", "hotfix332.patch")
          )
          foreach ($item in $items) {
            $encoded = (Get-Content $item[0] -Raw).Trim()
            $gzipPath = Join-Path $env:RUNNER_TEMP ($item[1] + ".gz")
            $patchPath = Join-Path $env:RUNNER_TEMP $item[1]
            [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
            python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$patchPath"
            git apply --whitespace=nowarn $patchPath
          }
          git diff --check
          node --check src/main.js
          node --check electron/main.cjs
          node --check electron/preload.cjs

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validar build
        run: |
          npm install
          npm run build

      - name: Guardar fonte montada
        uses: actions/upload-artifact@v4
        with:
          name: patched-source-3.3.2-test
          path: |
            src/main.js
            electron/main.cjs
            electron/preload.cjs
            public/mic-noise-worklet.js
            package.json
