name: Inspecionar fonte pós-patches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-patched.yml"
      - ".github/inspect/**"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Aplicar atualização preparada
        shell: pwsh
        run: |
          $partNames = @(
            "01.txt", "02.txt", "03.txt",
            "04r1.txt", "04r2.txt", "04r3.txt", "04r4.txt",
            "04fix2.txt", "04fix3.txt", "04fix4.txt", "04fix5.txt", "04fix6.txt", "04fix7.txt",
            "05.txt", "06.txt", "07.txt", "08.txt"
          )
          $parts = $partNames | ForEach-Object { Get-Item (Join-Path ".github/patch-parts" $_) }
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          $gzipPath = Join-Path $env:RUNNER_TEMP "resenhazinha.patch.gz"
          $patchPath = Join-Path $env:RUNNER_TEMP "resenhazinha.patch"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$patchPath"
          git apply --whitespace=nowarn $patchPath

      - name: Aplicar sair e excluir servidor
        shell: pwsh
        run: |
          $encoded = (Get-Content ".github/apply-server-exit-v3.0.5.py.gz.b64" -Raw).Trim()
          $gzipPath = Join-Path $env:RUNNER_TEMP "apply-server-exit.py.gz"
          $scriptPath = Join-Path $env:RUNNER_TEMP "apply-server-exit.py"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$scriptPath"
          python "$scriptPath"

      - name: Aplicar menu visível do servidor
        shell: pwsh
        run: |
          $encoded = (Get-Content ".github/apply-server-menu-v3.0.6.py.gz.b64" -Raw).Trim()
          $gzipPath = Join-Path $env:RUNNER_TEMP "apply-server-menu-v306.py.gz"
          $scriptPath = Join-Path $env:RUNNER_TEMP "apply-server-menu-v306.py"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$scriptPath"
          python "$scriptPath"

      - name: Aplicar voz e mixers 0 a 200
        shell: pwsh
        run: |
          $encoded = (Get-Content ".github/apply-voice-mixer-v3.1.0.py.gz.b64" -Raw).Trim()
          $gzipPath = Join-Path $env:RUNNER_TEMP "apply-voice-mixer-v310.py.gz"
          $scriptPath = Join-Path $env:RUNNER_TEMP "apply-voice-mixer-v310.py"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,sys; open(sys.argv[2],'wb').write(gzip.open(sys.argv[1],'rb').read())" "$gzipPath" "$scriptPath"
          python "$scriptPath"

      - name: Guardar fonte pós-patches
        uses: actions/upload-artifact@v4
        with:
          name: fonte-pos-patches-3.1.0
          path: |
            src/main.js
            src/styles.css
            index.html
            public/mic-noise-worklet.js
            electron/main.cjs
            electron/preload.cjs
          if-no-files-found: error
