name: Preparar v4.2.3

on:
  push:
    branches:
      - release/v4.2.3
    paths:
      - ".github/prepare-v4.2.3.py"
      - ".github/workflows/prepare-v4.2.3.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: release/v4.2.3

      - name: Preparar workflow oficial
        run: |
          python .github/prepare-v4.2.3.py
          python -m py_compile .github/apply-v4.2.3.py
          git diff --check

      - name: Salvar release.yml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Prepara publicação da v4.2.3"
          git push origin HEAD:release/v4.2.3
